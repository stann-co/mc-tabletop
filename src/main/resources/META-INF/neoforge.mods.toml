modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "tabletop"
version = "${mod_version}"
displayName = "Tabletop"
authors = "STANN.co"
description = "Playing cards, poker chips and a poker table, for playing poker by hand with friends."

[[mixins]]
config = "tabletop.mixins.json"

[[mixins]]
config = "tabletop.common.mixins.json"

[[dependencies.tabletop]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
