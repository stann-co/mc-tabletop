# Builds every push to master and development. On master, if the version in gradle.properties has no
# release yet, it tags the commit v<mod_version> and publishes a GitHub release with the jar.
name: Build and release

on:
  push:
    branches: [master, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Read version
        id: version
        run: |
          v=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: tabletop-${{ steps.version.outputs.version }}
          path: build/libs/tabletop-${{ steps.version.outputs.version }}.jar

      - name: Release if this version is new
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; bump mod_version in gradle.properties to release again."
            exit 0
          fi
          gh release create "$TAG" "build/libs/tabletop-$VERSION.jar" \
            --target "$GITHUB_SHA" --title "Tabletop $VERSION" --generate-notes
